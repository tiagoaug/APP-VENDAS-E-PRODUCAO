workflows:
  ios-simulator-build:
    name: iOS - Build de validação (simulador, sem assinatura)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $CM_BUILD_DIR/DerivedData
    scripts:
      - name: Instalar dependências (npm)
        script: npm ci
      - name: Build do frontend (Vite)
        script: npm run build
      - name: Sincronizar Capacitor iOS
        script: npx cap sync ios
      - name: Instalar CocoaPods (se algum plugin precisar — este projeto usa SPM por padrão)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          else
            echo "Sem Podfile — build 100% via Swift Package Manager."
          fi
      # Resolve os pacotes SPM (Firebase, MLKit, Capacitor core etc.) separado do build, com
      # retry manual — os downloads desses .zip grandes do GitHub Releases falham às vezes por
      # instabilidade de rede na máquina de build (não é um erro do nosso config), então tenta
      # de novo automaticamente em vez de derrubar o build inteiro na primeira falha.
      - name: Resolver pacotes Swift Package Manager (com retry)
        script: |
          for i in 1 2 3; do
            xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -derivedDataPath "$CM_BUILD_DIR/DerivedData" && break
            echo "Tentativa $i falhou, tentando de novo em 15s..."
            sleep 15
          done
      # Build só pra simulador: não precisa de conta de desenvolvedor Apple nem de
      # certificado de assinatura — serve pra validar que o projeto compila (inclusive
      # detectar se algum plugin sem Package.swift quebra o build via SPM).
      # -derivedDataPath explícito: sem isso o xcodebuild salva o .app na pasta padrão do
      # DerivedData (fora de qualquer caminho do repo), e o glob de `artifacts` abaixo nunca
      # encontra nada — build passa, mas não aparece nenhum artefato/Quick Launch no Codemagic.
      - name: Build para iOS Simulator (sem assinatura)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - DerivedData/Build/Products/*/*.app

  # Ativado agora que existe conta de Desenvolvedor Apple ($99/ano). Ainda precisa, uma vez só,
  # que VOCÊ conecte a integração "App Store Connect" no Codemagic (Team settings →
  # Integrations → App Store Connect → gerar/colar a API Key do App Store Connect: Issuer ID,
  # Key ID e o arquivo .p8 — gerados em appstoreconnect.apple.com → Users and Access →
  # Integrations → Keys). Integração já conectada com o nome "apple key 3 api" (ver
  # `integrations.app_store_connect` abaixo) — sem ela, tanto a assinatura automática quanto o
  # envio pro TestFlight abaixo falham na hora de rodar. Se trocar o nome da integração de novo
  # no Codemagic, precisa atualizar esse valor aqui também.
  # Também precisa o app já existir no App Store Connect (My Apps → + → New App) com o Bundle ID
  # exato com.musgo.vendaseproducao, mesmo que só pra teste — o TestFlight não aceita build de
  # um app que não foi cadastrado lá antes.
  ios-device-build:
    name: iOS - Build assinado (dispositivo real / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "apple key 3 api"
    environment:
      node: 22
      xcode: latest
      # Certificado ("codemagic certificate") e perfil de provisionamento ("App Store Connect",
      # criado manualmente em developer.apple.com → Profiles) já existem de verdade na conta —
      # `ios_signing:` reaproveita os dois automaticamente via a integração App Store Connect
      # conectada acima, sem precisar de nenhum script manual de fetch/create (essas tentativas
      # anteriores davam "Cannot save Signing Certificates without certificate private key"
      # porque tentavam CRIAR outro certificado, conflitando com o que já existe).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.musgo.vendaseproducao
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Instalar dependências (npm)
        script: npm ci
      - name: Build do frontend (Vite)
        script: npm run build
      - name: Sincronizar Capacitor iOS
        script: npx cap sync ios
      - name: Instalar CocoaPods (se necessário)
        script: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App && pod install
          fi
      - name: Assinatura automática de código
        script: xcode-project use-profiles
      - name: Build e assinatura do .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --verbose
    artifacts:
      # xcode-project build-ipa exporta relativo à raiz do repositório (confirmado no log:
      # "Successfully exported ipa to build/ios/ipa/App.ipa"), não dentro de ios/App/ — por
      # isso "Publishing" dava "No artifacts were found" mesmo com o .ipa gerado com sucesso.
      - build/ios/ipa/*.ipa
    publishing:
      # Envia o .ipa pro App Store Connect/TestFlight ao final do build — sem
      # `submit_to_testflight` de propósito: esse campo tenta submeter pra REVISÃO de teste
      # EXTERNO, que exige preencher Feedback Email + dados de contato em App Store Connect >
      # TestFlight > Test Information (ver erro real: "Complete test information is required").
      # Testadores INTERNOS (equipe do App Store Connect, ex.: você mesmo) não passam por
      # revisão nenhuma — o build já fica disponível pra eles assim que a Apple termina de
      # processar, direto na aba TestFlight > Testes internos, sem precisar desse campo.
      app_store_connect:
        auth: integration
